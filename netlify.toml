[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[[redirects]]
  from = "/api/interactions"
  to = "/.netlify/functions/get-interactions"
  status = 200

[[redirects]]
  from = "/api/comments"
  to = "/.netlify/functions/add-comment"
  status = 200

[[redirects]]
  from = "/api/reactions"
  to = "/.netlify/functions/set-reaction"
  status = 200

[[redirects]]
  from = "/api/votes"
  to = "/.netlify/functions/set-vote"
  status = 200
